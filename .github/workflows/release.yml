name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, publish and promote
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

env:
  GH_USERNAME: ${{ secrets.GH_USERNAME }}
  GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
  CODESCENE_IDE_DOCS_AND_WEBVIEW_TOKEN: ${{ secrets.CODESCENE_IDE_DOCS_AND_WEBVIEW_TOKEN }}

jobs:
  metadata:
    name: Validate Release Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      is_test: ${{ steps.release.outputs.is_test }}
      notes_start_tag: ${{ steps.release.outputs.notes_start_tag }}
      stable_tag: ${{ steps.release.outputs.stable_tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Babashka
        uses: ./.github/actions/setup-babashka

      - name: Validate Tag and Resolve Release Metadata
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" || true
          releases_file="$RUNNER_TEMP/releases.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases_file"
          bb --classpath .github -m release metadata "$TAG" "$GITHUB_EVENT_NAME" "$GITHUB_REF" origin/master "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" < "$releases_file" >> "$GITHUB_OUTPUT"

  build:
    name: Build Plugin
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          large-packages: true

      - name: Fetch Sources
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947

      - name: Build Plugin
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          FEATURE_CWF_DEVMODE: ${{ secrets.FEATURE_CWF_DEVMODE }}
        run: ./gradlew buildPlugin -PreleaseVersion="$VERSION" -PFEATURE_CWF_DEVMODE="$FEATURE_CWF_DEVMODE"

      - name: Verify Plugin Version
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: bash .github/verify_release_artifact.sh "$VERSION"

      - name: Upload Plugin
        uses: actions/upload-artifact@v4
        with:
          name: release-plugin
          path: ./build/distributions/CodeScene-${{ needs.metadata.outputs.version }}.zip

  create-release:
    name: Create GitHub Release
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Babashka
        uses: ./.github/actions/setup-babashka

      - name: Create or Update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_TEST: ${{ needs.metadata.outputs.is_test }}
          NOTES_START_TAG: ${{ needs.metadata.outputs.notes_start_tag }}
          STABLE_TAG: ${{ needs.metadata.outputs.stable_tag }}
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/release-notes.md"
          notes_args=(-f tag_name="$TAG")
          if [[ -n "$NOTES_START_TAG" ]]; then
            notes_args+=(-f previous_tag_name="$NOTES_START_TAG")
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${notes_args[@]}" --jq .body |
            bb --classpath .github -m release compose-notes "$IS_TEST" "$STABLE_TAG" "$TAG" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" \
              > "$notes_file"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, updating its title and notes."
            edit_args=("$TAG" --title "$TAG" --notes-file "$notes_file")
            if [[ "$IS_TEST" == "true" ]]; then
              edit_args+=(--prerelease --latest=false)
            else
              latest_error="$RUNNER_TEMP/latest-error.txt"
              if latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2> "$latest_error"); then
                :
              elif grep -q "HTTP 404" "$latest_error"; then
                latest_tag=
              else
                cat "$latest_error" >&2
                exit 1
              fi
              if [[ "$latest_tag" == "$TAG" ]]; then
                edit_args+=(--latest)
              else
                edit_args+=(--latest=false)
              fi
            fi
            gh release edit "${edit_args[@]}"
          else
            echo "Release $TAG does not exist, creating it."
            create_args=("$TAG" --title "$TAG" --notes-file "$notes_file" --verify-tag --latest=false)
            if [[ "$IS_TEST" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          fi

  upload:
    name: Upload Release Assets
    needs: [metadata, build, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Babashka
        uses: ./.github/actions/setup-babashka

      - name: Download Plugin
        uses: actions/download-artifact@v4
        with:
          name: release-plugin
          path: ./artifacts

      - name: Upload Missing Assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          existing_assets="$RUNNER_TEMP/existing-assets.txt"
          gh release view "$TAG" --json assets --jq '.assets[].name' > "$existing_assets"

          missing_list=$(bb --classpath .github -m release missing-assets "$existing_assets" "./artifacts/CodeScene-${VERSION}.zip")
          if [[ -z "$missing_list" ]]; then
            echo "All assets are already attached to $TAG, nothing to upload."
            exit 0
          fi
          mapfile -t upload_files <<< "$missing_list"
          gh release upload "$TAG" "${upload_files[@]}"

  test-gate:
    name: Verify Build Passed
    needs: [metadata, upload]
    if: needs.metadata.outputs.is_test == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Babashka
        uses: ./.github/actions/setup-babashka

      - name: Require a Successful Build Run for the Tagged Commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$SHA&per_page=100" --jq '[.workflow_runs[] | {status, conclusion, event, html_url}]' | bb --classpath .github -m release test-gate "$SHA"

  publish:
    name: Publish Plugin
    needs: [metadata, test-gate]
    if: needs.metadata.outputs.is_test == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          large-packages: true

      - name: Fetch Sources
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}

      - name: Fetch Release Tooling
        uses: actions/checkout@v4
        with:
          path: release-tooling
          sparse-checkout: .github/
          sparse-checkout-cone-mode: false

      - name: Setup Babashka
        uses: ./release-tooling/.github/actions/setup-babashka

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947

      - name: Build Plugin
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          FEATURE_CWF_DEVMODE: ${{ secrets.FEATURE_CWF_DEVMODE }}
        run: ./gradlew buildPlugin -PreleaseVersion="$VERSION" -PFEATURE_CWF_DEVMODE="$FEATURE_CWF_DEVMODE"

      - name: Verify Plugin Version
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: bash .github/verify_release_artifact.sh "$VERSION"

      - name: Publish Plugin
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          FEATURE_CWF_DEVMODE: ${{ secrets.FEATURE_CWF_DEVMODE }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          publish_log="$RUNNER_TEMP/publish.log"
          set +e
          ./gradlew publishPlugin -PreleaseVersion="$VERSION" -PFEATURE_CWF_DEVMODE="$FEATURE_CWF_DEVMODE" 2>&1 | tee "$publish_log"
          status=${PIPESTATUS[0]}
          set -e
          bb --classpath release-tooling/.github -m release marketplace-outcome "$status" "$publish_log"

  record-version:
    name: Record Released Version
    needs: [metadata, publish]
    if: needs.metadata.outputs.is_test == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - name: Fetch Master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Babashka
        uses: ./.github/actions/setup-babashka

      - name: Record the Released Version on Master
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: bb --classpath .github -m release record-version "$VERSION"

  promote:
    name: Mark Release Latest
    needs: [metadata, publish, record-version]
    if: needs.metadata.outputs.is_test == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Babashka
        uses: ./.github/actions/setup-babashka

      - name: Mark the Release Latest Unless a Newer Release Already Is
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest_error="$RUNNER_TEMP/latest-error.txt"
          if latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2> "$latest_error"); then
            :
          elif grep -q "HTTP 404" "$latest_error"; then
            latest_tag=
          else
            cat "$latest_error" >&2
            exit 1
          fi

          action=$(bb --classpath .github -m release promotion "$TAG" "$latest_tag")
          case "$action" in
            promote)
              gh release edit "$TAG" --latest
              echo "Marked $TAG as latest."
              ;;
            unchanged)
              echo "$TAG is already latest."
              ;;
            superseded)
              echo "$TAG is older than latest $latest_tag; leaving it not latest."
              ;;
            *)
              echo "Unexpected promotion action: $action" >&2
              exit 1
              ;;
          esac
